{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* Ajuste de padding-top para la barra de navegación */
        body { 
            font-family: 'Inter', sans-serif; color: #1A1A18; min-height: 100vh; 
            display: flex; align-items: center; justify-content: center; 
            padding: 5.5rem 1rem 2rem 1rem; 
            background-image: url("{% static 'img/djangoimg.jpg' %}"); 
            background-repeat: no-repeat; background-size: cover; 
            background-position: center; background-attachment: fixed; 
        }

        /* --- BARRA DE NAVEGACIÓN (VIAJE RÁPIDO) --- */
        .navbar {
            width: 100%; background-color: #FCFBF9; border-bottom: 1px solid #F2EAE4;
            padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; left: 0; z-index: 1000;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .nav-links { display: flex; gap: 1.5rem; align-items: center; }
        .nav-links a { text-decoration: none; color: #4A4642; font-weight: 600; font-size: 0.9rem; transition: color 0.15s ease; }
        .nav-links a:hover, .nav-links a.active { color: #9B1B22; }
        
        .user-actions { display: flex; align-items: center; gap: 1.5rem; }
        .user-greeting { font-size: 0.9rem; font-weight: 600; color: #1A1A18; }
        
        .btn-nav { padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.8rem; font-weight: 600; text-decoration: none; cursor: pointer; border: none; transition: all 0.15s ease; }
        .btn-logout { background-color: #9B1B22; color: white; }
        .btn-logout:hover { background-color: #7A151A; }
        /* ------------------------------------------- */

        .container { width: 100%; max-width: 420px; }
        .card { background: #FCFBF9; border-radius: 1rem; border: 1px solid #F2EAE4; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.15); overflow: hidden; }
        .card-header { padding: 2rem 2rem 1.5rem 2rem; background: linear-gradient(to bottom, #FFFFFF, #FCFBF9); border-bottom: 1px solid #F2EAE4; }
        .icon-badge { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 0.75rem; background-color: #FDECEE; color: #9B1B22; margin-bottom: 1rem; }
        h1 { font-size: 1.5rem; font-weight: 700; color: #1A1A18; margin-bottom: 0.25rem; }
        .card-header p { font-size: 0.875rem; color: #6D6863; }
        .card-body { padding: 1.75rem 2rem 1.5rem 2rem; }
        form p { margin-bottom: 1.25rem; display: flex; flex-direction: column; }
        form label { font-size: 0.875rem; font-weight: 600; color: #4A4642; margin-bottom: 0.375rem; }
        form input { width: 100%; padding: 0.65rem 0.875rem; border-radius: 0.625rem; border: 1px solid #D6CEC8; background-color: #FFFFFF; font-size: 0.875rem; font-family: inherit; transition: all 0.15s ease; }
        form input:focus { outline: none; border-color: #9B1B22; box-shadow: 0 0 0 3px rgba(155, 27, 34, 0.12); }
        .btn-submit { width: 100%; padding: 0.75rem 1.25rem; background-color: #9B1B22; color: #FFFFFF; font-size: 0.875rem; font-weight: 600; border: none; border-radius: 0.625rem; cursor: pointer; transition: all 0.15s ease; margin-top: 0.5rem; }
        .btn-submit:hover { background-color: #7A151A; }
        .helptext, .errorlist { font-size: 0.75rem; color: #6D6863; margin-top: 0.25rem; list-style: none; }
        .errorlist { color: #9B1B22; font-weight: 600; }
        
        /* --- PIE DE TARJETA (Botón cancelar) --- */
        .card-footer {
            padding: 1rem 2rem 1.5rem 2rem;
            background-color: #F8F6F4;
            border-top: 1px solid #F2EAE4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.875rem;
        }
        .card-footer a {
            color: #9B1B22;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            transition: color 0.15s ease;
        }
        .card-footer a:hover {
            color: #7A151A;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    
    <!-- Barra de Viaje Rápido Superior -->
    {% if user.is_authenticated %}
    <nav class="navbar">
        <div class="nav-links">
            <a href="{% url 'registrar' %}">📝 Cargar Estudiante</a>
            <a href="{% url 'lista' %}">👥 Lista de Estudiantes</a>
        </div>
        <div class="user-actions">
            <span class="user-greeting">Hola, {{ user.username }}</span>
            <form action="{% url 'logout' %}" method="post" style="margin: 0;">
                {% csrf_token %}
                <button type="submit" class="btn-nav btn-logout">Cerrar Sesión</button>
            </form>
        </div>
    </nav>
    {% endif %}

    <div class="container">
        <div class="card">
            <div class="card-header">
                <div class="icon-badge">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
                    </svg>
                </div>
                <h1>Crear Cuenta</h1>
                <p>Regístrate para acceder al sistema universitario.</p>
            </div>
            
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <!-- Esto renderiza el formulario mágico de Django -->
                    {{ form.as_p }}
                    <button type="submit" class="btn-submit">Registrarse</button>
                </form>
            </div>

            <!-- Botón de Cancelar y volver -->
            <div class="card-footer">
                <a href="{% url 'registrar' %}">&larr; Cancelar y volver</a>
            </div>
            
        </div>
    </div>
</body>
</html>
