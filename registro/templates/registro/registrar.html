<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de estudiantes</title>
</head>
<body>
  <h1>Registro de estudiantes</h1>

  {% if messages %}
    <ul>
      {% for m in messages %}
        <li>{{ m }}</li>
      {% endfor %}
    </ul>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Guardar</button>
  </form>

  <p><a href="{% url 'lista' %}">Ver registros</a></p>
  <h2>Hola</h2>
</body>
</html>
